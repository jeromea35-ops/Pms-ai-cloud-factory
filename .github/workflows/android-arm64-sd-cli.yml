name: Android ARM64 sd-cli Factory

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SD_REPO: https://github.com/leejet/stable-diffusion.cpp.git
  SD_COMMIT: 59c23bce0d82be3a922023ab811194f05b3e2faa
  NDK_VERSION: 27.2.12479018
  ANDROID_API: 28

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout factory repo
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git file binutils zip
      - name: Install pinned Android NDK
        run: |
          yes | sdkmanager "ndk;${NDK_VERSION}"
          test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Fetch pinned stable-diffusion.cpp source
        run: |
          git clone "${SD_REPO}" sd-src
          cd sd-src
          git checkout "${SD_COMMIT}"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "${SD_COMMIT}"
          git submodule status --recursive | tee ../submodules.txt

      - name: Configure Android ARM64 CPU build
        run: |
          cmake -S sd-src -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF
      - name: Build sd-cli
        run: |
          cmake --build build-android --target sd-cli --parallel 2

      - name: Verify AArch64 binary
        shell: bash
        run: |
          set -euo pipefail
          SDCLI="$(find build-android -type f -name sd-cli -perm -111 | head -n 1)"
          test -n "${SDCLI}"
          echo "SDCLI=${SDCLI}" >> "$GITHUB_ENV"
          file "${SDCLI}" | tee sd-cli.file.txt
          readelf -h "${SDCLI}" | tee sd-cli.elf-header.txt
          readelf -h "${SDCLI}" | grep -Eq 'Machine:.*AArch64'
          readelf -d "${SDCLI}" | tee sd-cli.dynamic.txt || true

      - name: Package phone runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "${SDCLI}" artifact/sd-cli
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" artifact/sd-cli || true
          cp sd-cli.file.txt sd-cli.elf-header.txt sd-cli.dynamic.txt submodules.txt artifact/
          cat > artifact/BUILD-MANIFEST.txt <<EOF
          stable-diffusion.cpp commit: ${SD_COMMIT}
          ABI: arm64-v8a
          Android API: ${ANDROID_API}
          STL: c++_static
          Backend: CPU
          OpenMP: OFF
          WebP: OFF
          WebM: OFF
          EOF
          (cd artifact && sha256sum * > SHA256SUMS)
          ls -lah artifact

      - name: Upload ARM64 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pms-sd-cli-android-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
